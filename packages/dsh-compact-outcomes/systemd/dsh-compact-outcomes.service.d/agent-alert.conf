# B-N-1168, 29.09.2026, Забава, слово владельца 12:41 «делай»: хвост тревоги agent-alert — запись разрешена вне ProtectSystem=strict.
# Без этого agent-alert из этой службы: «хвост НЕ записан: /var/log/agent-alert/poslednie.log … закрыт» (тревога доставлялась, хвост — нет).
[Service]
# №23 аудита A-N-1948 (10.10.2026): «-» — нет файла на старте (свежая машина, ротация) — служба всё равно поднимается;
# тогда agent-alert сам скажет «хвост НЕ записан», а тревога уйдёт как прежде.
ReadWritePaths=-/var/log/agent-alert/poslednie.log
