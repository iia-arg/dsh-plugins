# B-N-1175, 29.09.2026, Аврора (кандидат; монтаж — Забава): узкий канал событий сжатия Codex шлюза Марка (решение Забавы,
# вариант (1); drop-in SupplementaryGroups=systemd-journal ОТВЕРГНУТ — код службы в доме coders, группа дала бы любому
# Codex-кодеру чтение всего журнала машины). «+» — выборка под root вне песочницы службы; «-» — её отказ НЕ роняет
# наблюдение alfa/beta/gamma (turn_watch назовёт слепоту Марка по давности файла выборки, SVEZHEST).
# Имя и юнит — здесь, под root: какой журнал читает root, решает root, а не agents.json в доме coders.
[Service]
ExecStartPre=-+/usr/local/libexec/codex-compaction-vyborka marc coder-gateway-marc.service
# B-N-1837 (08.10.2026, Аврора): тот же канал для шлюза Анны (Codex-агент по образцу Марка).
ExecStartPre=-+/usr/local/libexec/codex-compaction-vyborka anna coder-gateway-anna.service
# 13.10.2026 (Искра): тот же канал для шлюза Мастера (Codex-агент по образцу Марка).
ExecStartPre=-+/usr/local/libexec/codex-compaction-vyborka master coder-gateway-master.service
