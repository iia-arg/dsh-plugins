# B-N-1435 (02.10.2026, Заря): «9.0G memory peak» приёмки 02.10 — почти весь страничный кэш скачанного и прочитанного
# архива, не процесс. Замер на копии 02.10: cgroup 11,1 ГБ, из них file 10,1 ГБ; собственная память потока 0,57 ГБ
# (0,15 ГБ после очистки tf.members). MemoryHigh велит ядру вытеснять этот кэш ВНУТРИ юнита, а не у соседей-агентов;
# процесс при этом НЕ убивается (в отличие от MemoryMax). Пробы под MemoryHigh=1G: поток копии 02.10 — то же время
# (2:59,9 против 2:59,6), пик 1,07 ГБ; запись 5 ГБ — 426 МБ/с (скачивание с Drive ~24 МБ/с, предел его не тормозит).
# 2G — запас ×~10 к нужной анонимной памяти (поток 0,15 + указатель в разделах приёмки 0,2 ГБ при 460 тыс. членов).
# ⚠️ НЕ ЛОВИТ рост анонимной памяти: выше 2G процесс замедлится, а не упадёт; рост ~0,4 КиБ на член копии.
[Service]
MemoryHigh=2G
