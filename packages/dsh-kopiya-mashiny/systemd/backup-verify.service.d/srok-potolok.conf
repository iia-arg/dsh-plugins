# B-N-1435 (C3, 02.10.2026, Заря): сроки звеньев считает СЦЕНАРИЙ от размера копии (proverka-svezhesti-kopii.sh, «2в»):
# скачивание 120 с + S/12 МБ/с, приёмка 120 с + S/60 МБ/с; звено гасит сам сценарий — с тревогой и итогом.
# Здесь ПОТОЛОК от зависания вне звеньев, а не срок: 3 ч, как у сборки (sadik-backup.service). Сценарий читает его
# у systemd и режет звенья до «потолок − 120 с». Формула упирается в 3 ч только при S > ~100 ГБ на худшей скорости;
# при прежних 3600 с — уже при S > ~32 ГБ, и тогда судьбу копии решал бы потолок, а не формула.
# Заменяет временный srok-3600.conf (B-H-1427, Забава): тот снять, иначе порядок чтения drop-in решает, чей срок.
[Service]
TimeoutStartSec=10800
