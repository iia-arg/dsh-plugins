# B-N-762 (24.09.2026, Михалыч): выгрузка копии — через awg0 (NL), только на время прогона.
# «-» у ExecStartPre: не поднялся путь — прогон идёт прежним путём (US), а не отменяется.
[Service]
Environment=BACKUP_SO_MARK=0x740
ExecStartPre=-/usr/local/sbin/kopiya-put-nl up
ExecStopPost=/usr/local/sbin/kopiya-put-nl down
