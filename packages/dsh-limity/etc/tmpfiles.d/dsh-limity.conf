# dsh-limity (B-N-1776 такт 2, Заря): приёмная замеров лимитов. Шлюзы Claude (группа claudeoauth) пишут .tmp → rename,
# читать и удалять чужие файлы не могут (нет r, sticky); разбирает и удаляет служба dsh-limity (root).
d /var/spool/dsh-limity      0711 root root        -
d /var/spool/dsh-limity/vhod 1730 root claudeoauth -
# 1.0.4: учётки замера (группа limity-vhod) пишут в приёмную по ACL — группу claudeoauth им НЕ даём (она открывает каталог шлюза).
a+ /var/spool/dsh-limity/vhod - - - - group:limity-vhod:-wx
