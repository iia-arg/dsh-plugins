# B-N-2105 (Заря, 17.10.2026; ворота Вениамина 09:01Z — drop-in, своим окном): ряд длительностей стендов ночного обхода.
#   /var/lib/vse-stendy-boevye — хозяин iskra (User= юнита), 0700; там ryad.tsv и ryad-otmetka. Пишет обходчик, судит обёртка после прохода.
#   Ворота берут Environment этого юнита в свою среду — запись из ворот закрыта в обходчике (нужен id прохода ночной обёртки, нет PAKET_IMYA).
[Service]
StateDirectory=vse-stendy-boevye
StateDirectoryMode=0700
Environment=VSE_STENDY_RYAD=/var/lib/vse-stendy-boevye/ryad.tsv
