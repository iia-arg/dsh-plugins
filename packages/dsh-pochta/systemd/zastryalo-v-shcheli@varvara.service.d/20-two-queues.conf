# B-N-1682: обе зарегистрированные щели, User=varvara унаследован от шаблона.
# Старое ZASTRYALO_SHCHEL из шаблона этому обработчику не используется.
[Service]
ExecStart=
ExecStart=/usr/bin/python3 /usr/local/libexec/zastryalo-varvara --shchel /opt/varvara/a2a/tell --shchel /opt/varvara/workspace/a2a/tell --state-dir /var/lib/zastryalo-varvara --alert-bin /usr/local/bin/agent-alert
StateDirectory=zastryalo-varvara
StateDirectoryMode=0700
TimeoutStartSec=45s
KillMode=control-group
SuccessExitStatus=1
