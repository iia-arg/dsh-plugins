# Bundle patch: what `dsh plugin add` composes into the profile.
# Requires @deepseek-ai/dsh-schedule to be mounted in the same profile (it ships
# with the platform but is not enabled by default). See the README.
- insert:
    - name: dsh-schedule-guard
      config:
        enabled: true
        limitOneShotWakeups: false   # opt-in only; Petrovich: enabled=false under owner30.09 02:26 Б
        maxConsecutiveWakeups: 6
        maxPerDay: 48
        minRepeatingIntervalSeconds: 1800
        dayBoundaryOffsetMinutes: 0
        # notifyCmd: /path/to/your/notify-owner-command   # optional; omit -> log only
        # notifyTimeoutSeconds: 90                         # optional; a hung channel is killed after this
