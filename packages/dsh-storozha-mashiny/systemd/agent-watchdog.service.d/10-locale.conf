# RU: Без заданной локали bash режет строку ${s:0:N} по БАЙТАМ,
# RU: обрыв приходится на середину русской буквы, и телеграм отвечает
# RU: 400 «text must be encoded in UTF-8» — тревога не уходит вовсе.
# EN: Without a locale bash cuts ${s:0:N} by BYTES, the cut lands in the
# EN: middle of a Cyrillic letter, and Telegram answers
# EN: 400 "text must be encoded in UTF-8" — the alert is not sent at all.
[Service]
Environment=LC_ALL=C.UTF-8
