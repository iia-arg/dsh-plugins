# RU: Страховка от повисшего таймера. OnBootSec+OnUnitActiveSec
# RU: отсчитываются от событий; пропустив оба (служба не стартовала за загрузку),
# RU: таймер уходит в NextElapse=infinity и молчит навсегда, показывая active(running).
# RU: Календарь от событий не зависит.
# EN: Insurance against a stuck timer. OnBootSec+OnUnitActiveSec count from events;
# EN: if both are missed (the unit never started during boot), the timer goes to
# EN: NextElapse=infinity and stays silent forever while showing active(running).
# EN: A calendar trigger does not depend on events.
[Timer]
OnCalendar=*:0/5
