# RU: StateDirectoryMode по умолчанию 0755 открывал каталог состояния прочим на КАЖДОМ старте по таймеру (замер: закрыли
# RU: руками — через час снова 755, ровно в момент старта юнита). В каталоге лежат письма наряда. Служба — root.
# EN: The default StateDirectoryMode 0755 reopened the state directory to others on EVERY timer start (measured: closed by
# EN: hand — an hour later 755 again, exactly at unit start). The directory holds the order letters. The service runs as root.
[Service]
StateDirectoryMode=0750
