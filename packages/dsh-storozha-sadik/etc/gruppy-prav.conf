# Эталон членов групп-шлюзов прав для gruppy-prav-watch (B-N-1913). Ставится в /etc/agent-registry/gruppy-prav.conf.
# <группа> sysusers           — члены = строки «m» в sysusers.d (там есть объявление группы)
# <группа> spisok a b …       — явный список: у группы нет объявления в sysusers, а «m» туда не дописываем
#                               (systemd-sysusers при загрузке СОЗДАЁТ недостающую учётку)
# <группа> spisok -           — членов быть не должно
# Изменение состава группы — правкой ЭТОЙ строки (рука монтажа), иначе тревога.
limity-vhod sysusers
