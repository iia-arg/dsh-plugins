# A-N-1963 №11 (Заря, 2026-10-10; кандидат, монтаж — Забава): пределы root-сторожу, читающему дома агентов.
# Без них подменённый агентом файл (раздутый — MemoryMax=infinity, FIFO — без таймаута) роняет машину в OOM или вешает такт.
# Память: пик 12 МБ (memory.peak cgroup, 15 запусков 06:53–07:24Z) → предел = max(128M, пик×4).
# MemorySwapMax=0: иначе сверх MemoryMax ядро уводит страницы в своп (8 ГБ на sadik) — сторож не убит, а ползёт.
# Время: TimeoutStartSec=3min уже в файле юнита (дольше всего за сутки 0.5 с) — не трогаю.
# Убит пределом → юнит failed (oom-kill / timeout); читатель — sadik-watch (is-failed по перечню таймеров).
# ⚠️ НЕ ЛОВИТ: раздутие в пределах лимита; сам факт чтения чужого файла от root (лечение — чтение от учётки агента, отдельно).
# Откат: удалить этот файл, systemctl daemon-reload.
[Service]
MemoryMax=128M
MemorySwapMax=0
