# Install ONLY for an approved guest instance, after all template drop-ins.
# Account must have no claudeoauth/systemd-journal membership in NSS either.
# Guest runtime is root-owned, read-only to guests, and contains code/dependencies only.
[Service]
SupplementaryGroups=
NoNewPrivileges=yes
Environment=
EnvironmentFile=
EnvironmentFile=/etc/claude-oauth/instance-%i.env
Environment=GATEWAY_INSTRUMENTY_DVIZHKA=net
UnsetEnvironment=OMEGA_MCP_API_KEY GATEWAY_MCP
UnsetEnvironment=OMEGA_GOST_KLYUCH
# B-N-1621 (Михалыч 08.10.2026): гостю ОДНА подписка. Прежде LoadCredential грузил все три (учётка varvara читала 1, 2, 3).
# Выбор — GATEWAY_TOKEN_FILE из instance-%i.env (его правит pereklyuchatel-podpiski); копию ровно его кладёт
# gost-podpiska-vybor (от root, ExecStartPre=+) в RuntimeDirectory — systemd удаляет её при остановке.
# guest-launch.sh не меняется: берёт токен из $CREDENTIALS_DIRECTORY/token-podpiska-<N> — указываем ему этот каталог.
LoadCredential=
RuntimeDirectory=claude-oauth-gost-%i
RuntimeDirectoryMode=0500
ExecStartPre=+/usr/local/libexec/gost-podpiska-vybor %i
Environment=CREDENTIALS_DIRECTORY=%t/claude-oauth-gost-%i
ExecStart=
ExecStart=/opt/subscription-gateway-guest/systemd/guest-launch.sh /opt/subscription-gateway-guest/gateway.mjs
