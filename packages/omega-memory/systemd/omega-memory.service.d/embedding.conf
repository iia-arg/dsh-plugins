# RU: Многоязычная bge-m3: обязательны локальные ONNX и tokenizer, cls/pad1, размерность 1024. Установка модели — README шаг 3; изменение размерности существующей БД требует отдельной миграции.
# EN: Multilingual bge-m3 requires local ONNX/tokenizer, cls/pad1 and dimension1024. See README step3; changing an existing DB dimension requires a separate migration.
[Service]
Environment=OMEGA_EMBEDDING_MODEL=bge-m3
Environment=OMEGA_EMBEDDING_MODEL_DIR=/var/lib/omega/.cache/omega/models/bge-m3-onnx
Environment=OMEGA_EMBEDDING_DIM=1024
Environment=OMEGA_EMBEDDING_POOLING=cls
Environment=OMEGA_EMBEDDING_PAD_TOKEN=<pad>
Environment=OMEGA_EMBEDDING_PAD_ID=1
