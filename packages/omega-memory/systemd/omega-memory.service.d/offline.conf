# RU: Без автоматического скачивания HF/реранкера. Модель должна быть подготовлена заранее; потерю/повреждение модели это не исправляет.
# EN: No automatic HF/reranker downloads. Prepare the model first; this does not repair missing/corrupt model files.
[Service]
Environment=HF_HUB_OFFLINE=1
Environment=OMEGA_RERANKER_AUTODOWNLOAD=0
