# Bundle patch: what `dsh plugin add` composes into the profile.
#
# 🔴 Note for anyone copying this: in the `web` profile the common-plane tools
# are disabled on purpose and the agent's toolset comes from its preset. If your
# agent must use tools, the channel row belongs in the AGENT PRESET, not here —
# a row in the profile layer composes cleanly, reports as mounted, and never
# reaches the agent. This file exists so the plugin is installable in one
# command; see the README for the preset placement.
- insert:
    - name: dsh-telegram-multiagent
      config:
        # Path to a file holding the bot token. Preferred over a literal token.
        tokenFile: /etc/dsh/bot.token
        # Where THIS agent's harness is installed — platform packages resolve
        # from here, so one shared module can serve several agents.
        appDir: /opt/agent/app
        # Empty means everyone can talk to an agent that usually has shell
        # access. Set it.
        allowedUsers: []
        # 🔴 УПРАВЛЕНИЕ ЦЕЛЯМИ ИЗ КАНАЛА. Оба списка пусты по умолчанию — это
        # значит, что команда постановки цели отвергается для ВСЕХ. Так задумано:
        # запуск автономного цикла стоит денег, поэтому право даётся поимённо и
        # НИКОГДА не наследуется от allowedUsers. Говорить с агентом и запускать
        # ему платный цикл — разные права.
        # Кому можно ставить цель из Telegram (числовые идентификаторы):
        goalUsers: []
        # Кому можно ставить цель из служебного канала между агентами.
        # Отправитель называет себя сам, первой строкой файла: "From: <имя>".
        # Это учёт, а не удостоверение личности — см. README.
        goalA2ASenders: []
