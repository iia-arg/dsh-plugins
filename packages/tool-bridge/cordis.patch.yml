# Что команда `dsh plugin add dsh-tool-bridge` вносит в профиль.
#
# ЗАЧЕМ ЭТОТ ФАЙЛ: чтобы плагин ставился одной командой, а не вписывался руками.
#
# 🔴 ПОЧЕМУ ВЫПИСАНЫ ВСЕ ПОЛЯ, ДАЖЕ РАВНЫЕ УМОЛЧАНИЯМ КОДА.
# В схеме настроек часть ключей объявлена БЕЗ значения по умолчанию, и со стороны
# это выглядит как «платформа их потребует». Не потребует: проверяющий настройки
# молча выбрасывает пропущенный ключ вместо отказа запускаться. Значит защита —
# не схема, а этот видимый блок. Монтаж без блока настроек поднимется, заработает
# и пойдёт на числах, которых никто не выбирал.
#
# Отличить «моя настройка доехала» от «поле потерялось при правке набора плагинов»
# позволяет строка подъёма: рядом с каждым значением она печатает его источник —
# файл агента, общий файл или умолчание кода. Пропустите поле здесь — и потеряете
# эту возможность: механизм продолжит работать, просто не на ваших числах, и
# ничего об этом не скажет.

- insert:
    - name: dsh-tool-bridge
      id: dsh-tool-bridge
      config:
        # Имя агента, которым адресуется его файл пределов
        # /etc/agent-limits/<агент>.yml. Одно и то же системное имя пользователя
        # может обслуживать разных агентов, поэтому имя задаётся, а не выводится.
        # Файла с таким именем нет — чтение откажет ГРОМКО, возьмётся самый
        # строгий набор пределов, и причина будет названа в журнале.
        limitsAgent: agent

        # Имя сервера MCP. От него зависят имена инструментов у модели:
        # mcp__<имя>__<инструмент>. Меняя его, помните, что меняются и они.
        serverName: bridge

        # Порт точки входа на петле. Ноль — занять свободный и сообщить адаптеру.
        port: 0

        # Домены платформы, которые мост выставляет модели.
        domains: [goals]

        # Каталог для письма об остановке цикла самопробуждения.
        # Пустая строка — настроенный исход: текст письма целиком уходит в журнал.
        # Это не потеря; путь по умолчанию был бы хуже, потому что у вас такого
        # каталога нет, запись отказала бы, и отказ пришлось бы отличать от замысла.
        heartbeatNoticeDir: ''
