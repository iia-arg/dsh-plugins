# Голосовой стек переведён на выделенного системного пользователя (20.08.2026).
# Причина не косметическая: расшифровка принимает ЧУЖОЙ звук — голосовое от
# постороннего попадает в неё раньше, чем сработает белый список канала. Это
# единственный компонент, обрабатывающий недоверенный вход, и жить он должен в
# пустой служебной учётке, а не в рабочей учётке человека.
[Service]
User=voicesvc
Group=voicesvc
# 🔴 Права на видеоядро — ЯВНОЙ строкой. Набор групп фиксируется при запуске
# процесса, и «добавили пользователя в группу» живую службу не меняет.
SupplementaryGroups=video render
# 🔴 Код и словарь службы перенесены из домашнего каталога человека в каталог
# самой службы (20.08.2026). Системная служба, читающая файлы из чужого дома,
# ломается при первой же смене прав или переносе — и ломается молча.
Environment=SAGE_GLOSSARY=/opt/sage-corrector/glossary.txt
ExecStart=
ExecStart=/opt/sage-corrector/venv/bin/python3 /opt/sage-corrector/sage_warm_server.py
