# C-N-1383 (4), Искра 01.10.2026: ожидание сокета после старта — 180 с вместо 60, предел старта юнита — 200 с.
# ЗАЧЕМ. aclaude 01.10 19:07:05 МСК: перезапуск при давлении памяти (swap на пике 163,8 МБ) — сокет не появился
# за 60 с, ExecStartPost отказал и УБИЛ ещё грузившийся демон; со 2-й попытки сокет за 26 с. На sadik холодная
# загрузка 30.09 — 4 с, перезапуск 01.10 — 3 с.
# 🔴 180 — ОЦЕНКА СНИЗУ, не вывод: первая попытка оборвана на 60 с, сколько ей было нужно — неизвестно; холодный
# старт без остановки боевого демона не измерить (модель отображена в его память, из кэша не выгоняется).
# TimeoutStartSec поднят вместе с циклом: по умолчанию 90 с, и он оборвал бы старт раньше 180.
# ЧЕГО НЕ ДЕЛАЕТ: не ускоряет загрузку; голосовые в эти секунды идут без коррекции (сокета нет — сырой путь).
[Service]
TimeoutStartSec=200
ExecStartPost=
ExecStartPost=/bin/sh -c 'for i in $(seq 1 180); do [ -S /run/sage-corrector/sage.sock ] && exit 0; sleep 1; done; exit 1'
